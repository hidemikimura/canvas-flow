<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>canvas-flow demo — 10,000 nodes</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header {
        display: flex; gap: 12px; align-items: center; padding: 8px 12px;
        border-bottom: 1px solid #ddd; background: #fff; flex-wrap: wrap;
      }
      header label { display: inline-flex; gap: 4px; align-items: center; }
      .stage { flex: 1; min-height: 0; display: flex; }
      canvas-flow-editor { flex: 1; min-width: 0; min-height: 0; }
      canvas-flow-editor.drop-target { outline: 2px dashed #2563eb; outline-offset: -2px; }
      #stats { color: #64748b; font-variant-numeric: tabular-nums; }
      button { font: inherit; }

      /* 左のノードパレット（ドラッグ&ドロップでキャンバスに追加） */
      #palette {
        width: 196px; flex: none; overflow: auto; padding: 8px 8px 16px;
        border-right: 1px solid #ddd; background: #fafbfc;
      }
      #palette h3 {
        font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
        color: #64748b; margin: 12px 2px 6px; font-weight: 600;
      }
      #palette h3:first-child { margin-top: 0; }
      .pal-item {
        cursor: grab; border: 1px solid transparent; border-radius: 8px;
        padding: 6px; margin-bottom: 2px;
      }
      .pal-item:hover, .pal-item:focus-visible { background: #eef2ff; border-color: #c7d2fe; outline: none; }
      .pal-item.dragging { opacity: .45; }
      .pal-preview { display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
      .pal-node {
        border: 1px solid var(--pal-stroke, #c9ced6); border-radius: 5px;
        background: var(--pal-fill, #fff); overflow: hidden;
      }
      .pal-head {
        background: var(--pal-head, #eef1f5); color: var(--pal-title, #1f2933);
        font-size: 11px; font-weight: 600; padding: 3px 6px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .pal-row {
        font-size: 10px; padding: 2px 6px; color: var(--pal-text, #64748b);
        border-top: 1px solid var(--pal-sep, #eef1f5);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .pal-row.child { padding-left: 14px; }
      .pal-badge {
        display: inline-block; font-size: 9px; line-height: 1.5; padding: 0 5px;
        border-radius: 999px; color: #fff; background: #475569; margin-left: 4px;
      }
      .pal-name { font-size: 11.5px; color: #334155; margin-top: 2px; }
    </style>
  </head>
  <body>
    <header>
      <strong>canvas-flow</strong>
      <label>ノード数 <input id="count" type="number" value="10000" min="1" step="1000" style="width:7em" /></label>
      <button id="regen">再生成</button>
      <button id="add">ノード追加</button>
      <button id="add-child" title="選択したノードの中に子ノードを追加">子ノード追加</button>
      <button id="detach-child" title="選択した子ノードを親から出す">子ノードを出す</button>
      <label><input id="dragmode" type="checkbox" /> 空白ドラッグで範囲選択（Shift で切替）</label>
      <label><input id="theme" type="checkbox" /> ダークテーマ</label>
      <label title="value 入力は 1 本、threshold 入力は 2 本、ヘッダ出力は 3 本まで"><input id="onfull" type="checkbox" /> 満杯ポートへの接続は付け替え</label>
      <label>移動単位 <select id="snap"><option value="0">なし</option><option value="8">8px</option><option value="16">16px</option><option value="32">32px（グリッド）</option><option value="50">50px</option></select></label>
      <label>コネクタ <select id="edge-type"><option value="bezier">曲線</option><option value="straight">直線</option><option value="step">直角</option></select></label>
      <label>強調 <select id="focus"><option value="off">なし</option><option value="connected:lineage">同じ道筋（祖先と子孫）</option><option value="connected:downstream">進める先だけ</option><option value="connected:upstream">元をたどる</option><option value="connected:both">前後すべて</option><option value="neighbors:lineage">1 段だけ</option></select></label>
      <span id="stats"></span>
      <span style="margin-left:auto;color:#64748b">
        左のパレットからドラッグして追加 / ホイール: ズーム / Shift+ホイール: パン / Space+ドラッグ: パン / ダブルクリック: 編集 / N: マウス位置にノード追加 / Ctrl+D: 複製 / Delete: 削除 / Ctrl+Shift+A: 強調を選択 / 右クリック: メニュー
      </span>
    </header>
    <div class="stage">
      <div id="palette" title="ドラッグしてキャンバスに置くと追加されます（クリックで画面中央に追加）"></div>
      <canvas-flow-editor id="editor"></canvas-flow-editor>
    </div>
    <script type="module" src="/demo/main.js"></script>
  </body>
</html>
